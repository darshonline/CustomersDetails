<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نموذج تحديث بيانات عميل | IDTC</title>
<style>
:root{--r:#d71920;--d:#1c1c1e;--m:#6b6b70;--l:#e6e6ea}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Tahoma,"Segoe UI",Arial,sans-serif;background:#f5f5f7;color:var(--d)}
header{background:#fff;border-bottom:3px solid var(--r);padding:12px 16px;text-align:center}
header img{max-width:320px;width:80%}
h1{font-size:17px;margin:6px 0 0}h1 small{display:block;color:var(--m);font-weight:400;direction:ltr}
main{max-width:920px;margin:16px auto;padding:0 12px}
section{background:#fff;border:1px solid var(--l);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 12px;color:#fff;background:var(--r);display:inline-block;padding:3px 14px;border-radius:6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px}
label.f i{color:var(--m);font-size:12px;font-style:normal;direction:ltr;display:inline-block}
em{color:var(--r);font-style:normal}
input,select{padding:9px;border:1px solid #c9c9ce;border-radius:8px;font:inherit;width:100%;background:#fff}
input:focus,select:focus{outline:2px solid var(--r);border-color:transparent}
.err{color:var(--r);font-size:12px}
.sub{font-size:13px;margin:14px 0 6px;color:var(--m)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;background:#fafafa;padding:6px;border:1px solid var(--l)}
td{border:1px solid var(--l);padding:2px}td input{border:0;border-radius:0}
.pri{background:var(--r);color:#fff;border:0;padding:11px 28px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.pri:disabled{opacity:.5}
.ghost{background:none;border:1px dashed var(--m);border-radius:8px;padding:6px 14px;margin:8px 4px 0 0;cursor:pointer;font:inherit}
.x{background:none;border:0;color:var(--r);font-size:18px;cursor:pointer}
.ok,.bad{padding:12px;border-radius:8px;margin:10px 0}.ok{background:#e8f6ec;border:1px solid #9bd3aa}.bad{background:#fdecec;border:1px solid #f0a5a8}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input{flex:1;min-width:200px}
@media print{header img{max-width:220px}.no,.ghost,.x{display:none!important}body{background:#fff}section{break-inside:avoid;border:1px solid #999}}
</style>
</head>
<body>
<header><img src="logo.png" alt="IDTC"><h1 id="ttl"></h1></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const D=s=>String(s??'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim();
const ES=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// [key, English, Arabic, required, type]
const CUST=[['name','Customer Name','اسم العميل',1],['head','Head office','المكتب الرئيسي'],['addr','National Address','العنوان الوطني (مثال: RRRD2929)',1],['tel','Tel','هاتف'],['cr','Commercial Registration','السجل التجاري',1],['mobile','Mobile','جوال',1],['vat','VAT No.','الرقم الضريبي',1],['email','E-Mail','بريد إلكتروني',1]];
const INT1=[['code','Customer Code','كود العميل',1]];
const SALES=[['region','Region','المنطقة'],['sales','Salesman Responsible','المندوب المسئول',1],['scode','Salesman Code','كود المندوب']];
const ALLC=[...CUST,...SALES];
const RATE=[['rating','Salesman Rating of Customer','تقييم المندوب للعميل',0,'select']];
const INT2=[['limit','Credit Limit','الحد الائتماني',0,'number'],['terms','Credit Terms','شروط الدفع'],['rebate','Rebate %','نسبة الخصم على المبيعات',0,'number'],['lfee','Listing Fees','رسم إدراج صنف',0,'number'],['ofee','Opening Fees','رسم افتتاح فرع',0,'number']];
const RATING=[['5','5 — ممتاز · Excellent'],['4','4 — جيد جداً · Very good'],['3','3 — جيد · Good'],['2','2 — مقبول · Fair'],['1','1 — ضعيف · Poor']];
const CONT=[['n','Contact Person','الاسم'],['t','Job Title','الوظيفة'],['tel','Tel.','هاتف'],['ex','Ex.','تحويلة'],['mob','Mobile','جوال'],['em','E-Mail','البريد']];
const BR=[['n','Branch Name','اسم الفرع'],['city','City','المدينة'],['area','Area','الحي']];
const COLS={contacts:CONT,branches:BR};
const FILES=[['cr','Commercial Registration Certificate','شهادة السجل التجاري',1],['vat','VAT Registration Certificate','شهادة ضريبة القيمة المضافة',1],['na','National Address','شهدة إثبات العنوان الوطني',1],['br','List of Branches','قائمة الأفرع']];
const RULES={cr:[/^\d{10}$/,'السجل التجاري 10 أرقام'],vat:[/^3\d{13}3$/,'الرقم الضريبي 15 رقماً يبدأ وينتهي بالرقم 3'],mobile:[/^(\+?966|0)?5\d{8}$/,'رقم جوال سعودي مثل 05xxxxxxxx'],email:[/^[^\s@]+@[^\s@]+\.[^\s@]+$/,'بريد إلكتروني غير صحيح'],addr:[/^.{8,}$/,'العنوان الوطني 8 خانات على الأقل']};
const CLEAN=['cr','vat','mobile','tel'];
let CODE,LIST=[];const app=$('#app');

const ctl=(f,v)=>f[4]==='select'?`<select name=${f[0]}><option value="">— اختر —</option>${RATING.map(([k,t])=>`<option value=${k}${String(v)===k?' selected':''}>${t}</option>`).join('')}</select>`:`<input name=${f[0]} type=${f[4]||'text'} value="${ES(v)}">`;
const field=(f,v='')=>`<label class=f><span><b>${f[2]}</b>${f[3]?' <em>*</em>':''} <i>${f[1]}</i></span>${ctl(f,v)}</label>`;
const row=(cols,r={})=>`<tr>${cols.map(c=>`<td><input data-k=${c[0]} value="${ES(r[c[0]])}"></td>`).join('')}<td><button type=button class=x data-del>×</button></td></tr>`;
const tbl=(id,cols,rows)=>`<div class=tw><table data-t=${id}><thead><tr>${cols.map(c=>`<th>${c[2]}<br>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>row(cols,r)).join('')}</tbody></table></div><button type=button class=ghost data-add=${id}>+ إضافة صف</button>`;

function collect(root){
  const o={};
  $$('[name]:not([type=file])',root).forEach(i=>{let v=D(i.value);if(CLEAN.includes(i.name))v=v.replace(/[\s-]/g,'');o[i.name]=v});
  $$('table[data-t]',root).forEach(t=>o[t.dataset.t]=$$('tbody tr',t).map(tr=>Object.fromEntries($$('[data-k]',tr).map(i=>[i.dataset.k,D(i.value)]))).filter(r=>Object.values(r).some(Boolean)));
  return o;
}
function validate(o,list){
  let ok=true;$$('.err').forEach(e=>e.remove());
  list.forEach(([k,,,req])=>{
    const m=req&&!o[k]?'حقل مطلوب':o[k]&&RULES[k]&&!RULES[k][0].test(o[k])?RULES[k][1]:'';
    if(m){ok=false;$(`[name=${k}]`).closest('label').insertAdjacentHTML('beforeend',`<small class=err>${m}</small>`)}
  });
  return ok;
}
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function api(b){
  if(!CFG.ENDPOINT)throw'NO_ENDPOINT';
  const r=await fetch(CFG.ENDPOINT,{method:'POST',body:JSON.stringify(b)});
  return r.json();
}
const toB64=wb=>XLSX.write(wb,{type:'base64',bookType:'xlsx'});
const say=(el,c,t)=>{el.className=c;el.textContent=t};

function xlsx(d,int){
  const wb=XLSX.utils.book_new(),kv=(L,o)=>L.map(f=>[f[1]+' · '+f[2],o[f[0]]??'']),
  tb=(cols,rows)=>[cols.map(c=>c[1]+' · '+c[2]),...(rows||[]).map(r=>cols.map(c=>r[c[0]]??''))],
  add=(rows,n,w)=>{const s=XLSX.utils.aoa_to_sheet(rows);s['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,s,n)};
  add([['Customer Data Update Form · نموذج تحديث بيانات عميل'],[],...kv(ALLC,d),[],...tb(CONT,d.contacts),[],...tb(BR,d.branches)],'Customer',[42,28,22,14,20,28]);
  if(int)add([['Internal Form · نموذج داخلي - إدارة المبيعات'],[],['Reference · المرجع',d.id||''],['Customer Name · اسم العميل',d.name],...kv(INT1,d),...kv(INT2,d),...kv(RATE,d)],'Internal',[42,28]);
  wb.Workbook={Views:[{RTL:true}]};
  return wb;
}

/* ---------- Customer ---------- */
function cust(){
  $('#ttl').innerHTML='نموذج تحديث بيانات عميل <small>Customer Data Update Form</small>';
  const d=JSON.parse(localStorage.getItem('idtc_draft')||'{}');
  app.innerHTML=`<form id=f novalidate>
  <section><h2>المعلومات الأساسية · Basic Information</h2><div class=g>${CUST.map(x=>field(x,d[x[0]])).join('')}</div></section>
  <section><h2>بيانات المندوب · Salesman Info</h2><div class=g>${SALES.map(x=>field(x,d[x[0]])).join('')}</div></section>
  <section><h2>تفاصيل الاتصال · Contact details</h2>${tbl('contacts',CONT,d.contacts?.length?d.contacts:[{},{},{}])}</section>
  <section><h2>معلومات الفروع · Branches Info</h2>${tbl('branches',BR,d.branches?.length?d.branches:[{},{},{}])}</section>
  <section><h2>المرفقات · Attachments</h2><div class=g>${FILES.map(([k,en,ar,r])=>`<label class=f><span><b>${ar}</b>${r?' <em>*</em>':''} <i>${en}</i></span><input type=file name=file_${k} accept=".pdf,image/*"></label>`).join('')}</div></section>
  <div id=msg></div><button class=pri>إرسال البيانات · Submit</button></form>`;
  const f=$('#f');
  f.oninput=()=>localStorage.setItem('idtc_draft',JSON.stringify(collect(f)));
  f.onsubmit=async e=>{
    e.preventDefault();
    const o=collect(f),m=$('#msg'),fs=FILES.map(([k,,,r])=>[k,f['file_'+k].files[0],r]);
    const ok=validate(o,ALLC),miss=fs.some(([,x,r])=>r&&!x),big=fs.some(([,x])=>x&&x.size>4e6);
    if(!ok||!o.contacts.length||miss||big)return say(m,'bad',!ok?'يرجى تصحيح الحقول المشار إليها':!o.contacts.length?'أضف جهة اتصال واحدة على الأقل':miss?'يرجى إرفاق المستندات المطلوبة (*)':'حجم الملف الواحد يجب ألا يتجاوز 4MB');
    say(m,'','جارٍ الإرسال…');$('.pri').disabled=true;
    o.files=await Promise.all(fs.filter(x=>x[1]).map(async([k,x])=>({k,n:x.name,type:x.type||'application/octet-stream',b64:await b64(x)})));
    const wb=xlsx(o,0);
    try{
      const r=await api({a:'submit',d:o,xlsx:toB64(wb)});if(!r.ok)throw r.err;
      localStorage.removeItem('idtc_draft');
      app.innerHTML=`<section class=ok><h2>تم استلام بياناتكم ✔</h2><p>رقم المرجع: <b dir=ltr>${r.id}</b></p><button class=ghost id=cp>تحميل نسخة Excel</button></section>`;
      $('#cp').onclick=()=>XLSX.writeFile(wb,r.id+'.xlsx');
    }catch(err){
      XLSX.writeFile(wb,'Customer_'+o.vat+'.xlsx');
      say(m,'bad',err==='NO_ENDPOINT'?'التخزين السحابي غير مفعّل بعد؛ تم تنزيل الملف على جهازك.':'تعذّر الإرسال ('+err+')؛ تم تنزيل نسخة على جهازك، يرجى إرسالها لنا أو إعادة المحاولة.');
      $('.pri').disabled=false;
    }
  };
}

/* ---------- Admin ---------- */
function admin(){
  $('#ttl').innerHTML='إدارة المبيعات <small>Sales Management</small>';
  app.innerHTML=`<section style="max-width:380px;margin:auto"><h2>تسجيل الدخول</h2><input id=code type=password placeholder="رمز الدخول"><button class=pri id=go style="margin-top:10px">دخول</button><div id=msg></div></section>`;
  const go=async()=>{
    CODE=$('#code').value;const m=$('#msg');say(m,'','جارٍ التحميل…');
    try{const r=await api({a:'list',code:CODE});if(!r.ok)throw r.err==='auth'?'رمز غير صحيح':r.err;LIST=r.rows;list()}
    catch(e){say(m,'bad',e==='NO_ENDPOINT'?'لم يتم ربط التخزين بعد (config.js)':String(e))}
  };
  $('#go').onclick=go;$('#code').onkeydown=e=>e.key==='Enter'&&go();
}
function list(){
  app.innerHTML=`<section><div class=bar><input id=q placeholder="بحث بالاسم أو الرقم الضريبي أو المرجع"><button class=ghost id=rf>تحديث</button></div><div class=tw><table><thead><tr><th>المرجع<th>التاريخ<th>العميل<th>الرقم الضريبي<th>الحالة<th></thead><tbody id=tb></tbody></table></div></section>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();$('#tb').innerHTML=LIST.filter(r=>JSON.stringify([r.id,r.name,r.vat]).toLowerCase().includes(q)).reverse().map(r=>`<tr><td>${ES(r.id)}<td>${ES(r.date)}<td>${ES(r.name)}<td>${ES(r.vat)}<td>${r.status==='New'?'🟠 جديد':'🟢 مكتمل'}<td><button class=ghost data-o="${ES(r.id)}">فتح</button>`).join('')};
  $('#q').oninput=draw;draw();
  $('#rf').onclick=async()=>{const r=await api({a:'list',code:CODE});if(r.ok){LIST=r.rows;draw()}};
}
function rec(id){
  const r=LIST.find(x=>x.id===id),nz=a=>a?.length?a:[{}];
  app.innerHTML=`<div class="bar no"><button class=ghost id=bk>← القائمة</button><button class=ghost id=xl>تنزيل Excel</button><button class=ghost id=pr>طباعة / PDF</button></div>
  <form id=f novalidate><p>المرجع: <b dir=ltr>${ES(id)}</b> — ${ES(r.date)}</p>
  <section><h2>بيانات العميل · Customer</h2><div class=g>${ALLC.map(x=>field(x,r[x[0]])).join('')}</div><h3 class=sub>جهات الاتصال · Contacts</h3>${tbl('contacts',CONT,nz(r.contacts))}<h3 class=sub>معلومات الفروع · Branches Info</h3>${tbl('branches',BR,nz(r.branches))}<p class=no>${(r.files||[]).map(x=>`<a target=_blank href="${ES(x.url)}">📎 ${ES(x.n)}</a>`).join(' · ')}</p></section>
  <section><h2>البيانات الداخلية · Internal</h2><div class=g>${[...INT1,...INT2,...RATE].map(x=>field(x,r[x[0]])).join('')}</div></section>
  <div id=msg class=no></div><button class="pri no">حفظ واعتماد</button></form>`;
  const f=$('#f');
  $('#bk').onclick=list;$('#pr').onclick=()=>print();$('#xl').onclick=()=>XLSX.writeFile(xlsx({...r,...collect(f)},1),id+'.xlsx');
  f.onsubmit=async e=>{
    e.preventDefault();const o={...r,...collect(f)},m=$('#msg');
    if(!validate(o,[...ALLC,...INT1]))return say(m,'bad','يرجى تصحيح الحقول المشار إليها');
    say(m,'','جارٍ الحفظ…');
    try{const x=await api({a:'internal',code:CODE,id,d:o,xlsx:toB64(xlsx(o,1))});if(!x.ok)throw x.err;Object.assign(r,o,{status:'Completed'});say(m,'ok','تم الحفظ ✔')}
    catch(err){say(m,'bad','تعذّر الحفظ: '+err)}
  };
}

app.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.add)$(`table[data-t=${t.dataset.add}] tbody`).insertAdjacentHTML('beforeend',row(COLS[t.dataset.add]));
  if(t.dataset.del){const tb=t.closest('tbody');tb.rows.length>1?t.closest('tr').remove():$$('input',tb).forEach(i=>i.value='')}
  if(t.dataset.o)rec(t.dataset.o);
});
const route=()=>location.hash==='#admin'?admin():cust();
onhashchange=route;route();
</script>
</body>
</html>
